plugins {
    id 'java'
}

group = 'com'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework:spring-context:7.0.8")
    implementation("org.springframework:spring-webmvc:7.0.8")
    implementation("org.springframework:spring-jdbc:7.0.8")
    implementation("org.springframework.data:spring-data-jpa:4.1.0")
    implementation("org.postgresql:postgresql:42.7.13")
    implementation("org.hibernate.orm:hibernate-core:7.4.5.Final")
    implementation("org.springframework:spring-orm:7.0.8")
    implementation("org.hibernate.orm:hibernate-core:7.4.5.Final")
    implementation("org.hibernate.validator:hibernate-validator:9.1.3.Final")
    implementation("org.glassfish.expressly:expressly:6.0.0")
    implementation("org.apache.tomcat.embed:tomcat-embed-core:11.0.14")
    implementation("tools.jackson.core:jackson-databind:3.2.2")
    implementation("ch.qos.logback:logback-classic:1.6.3")

    compileOnly("jakarta.servlet:jakarta.servlet-api:6.2.0-M2")

    testImplementation("org.junit.jupiter:junit-jupiter:6.1.2")
    testImplementation("org.mockito:mockito-junit-jupiter:5.23.0")
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testImplementation("org.springframework:spring-test:7.0.8")

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.test {
    useJUnitPlatform()
}